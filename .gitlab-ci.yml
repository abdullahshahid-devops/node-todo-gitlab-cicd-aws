stages:
  - test
  - build
  - publish
  - deploy

variables:
  IMAGE_TAG: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"

test_job:
  stage: test
  image: node:22-alpine
  script:
    - npm ci
    - npm test

build_job:
  stage: build
  image: docker:cli
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  script:
    - docker info
    - docker build -t "$IMAGE_TAG" .
    - docker save "$IMAGE_TAG" -o image.tar
  artifacts:
    paths:
      - image.tar
    expire_in: 1 hour

publish_job:
  stage: publish
  image: docker:cli
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  needs:
    - job: build_job
      artifacts: true
  script:
    - docker load -i image.tar
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - docker push "$IMAGE_TAG"

deploy_job:
  stage: deploy
  image: alpine:3.22
  needs:
    - publish_job
  before_script:
    - apk add --no-cache openssh-client curl
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
    - chmod 600 ~/.ssh/deploy_key
    - ssh-keyscan -t ed25519 "$EC2_HOST" > ~/.ssh/known_hosts
    - ssh-keygen -lf ~/.ssh/known_hosts | awk '{print $2}' | grep -Fx "$EC2_HOST_KEY_FINGERPRINT"
  script:
    - |
      ssh -i ~/.ssh/deploy_key \
        -o IdentitiesOnly=yes \
        "$EC2_USER@$EC2_HOST" \
        "IMAGE_TAG='$IMAGE_TAG' CI_REGISTRY='$CI_REGISTRY' CI_REGISTRY_USER='$CI_REGISTRY_USER' CI_REGISTRY_PASSWORD='$CI_REGISTRY_PASSWORD' sh -s" <<'REMOTE'
      set -eu

      old_image=$(docker inspect node-todo-app --format '{{.Config.Image}}' 2>/dev/null || true)
      echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
      docker pull "$IMAGE_TAG"

      docker rm -f node-todo-candidate 2>/dev/null || true
      docker run -d --name node-todo-candidate \
        --user node \
        -p 127.0.0.1:8003:8000 "$IMAGE_TAG"

      if ! curl --retry 10 --retry-delay 3 --retry-connrefused --max-time 5 -fsS \
        http://127.0.0.1:8003/todo >/dev/null; then
        docker rm -f node-todo-candidate || true
        echo "Candidate failed; existing app remains running"
        exit 1
      fi

      docker rm -f node-todo-app 2>/dev/null || true
      if docker run -d --name node-todo-app --restart unless-stopped \
        --user node \
        -p 127.0.0.1:8002:8000 "$IMAGE_TAG"; then
        if curl --retry 5 --retry-delay 2 --retry-connrefused -fsS \
          http://127.0.0.1:8002/todo >/dev/null; then
          docker rm -f node-todo-candidate
          echo "Deployment successful"
          exit 0
        fi
      fi

      echo "New deployment failed; restoring previous image"

      if [ -z "$old_image" ]; then
       echo "First deployment failed; cleaning up failed containers"
       docker rm -f node-todo-app 2>/dev/null || true
       docker rm -f node-todo-candidate 2>/dev/null || true
       exit 1
      fi

      docker rm -f node-todo-app 2>/dev/null || true

      if docker run -d --name node-todo-app --restart unless-stopped \
        --user node \
        -p 127.0.0.1:8002:8000 "$old_image"; then
        if curl --retry 5 --retry-delay 2 --retry-connrefused -fsS \
          http://127.0.0.1:8002/todo >/dev/null; then
          echo "Rollback successful; previous app is healthy"
        else
          echo "CRITICAL: rollback health check failed"
          exit 1
        fi
      else
        echo "CRITICAL: could not restore previous app"
        exit 1
      fi

      docker rm -f node-todo-candidate 2>/dev/null || true
      exit 1
      REMOTE
