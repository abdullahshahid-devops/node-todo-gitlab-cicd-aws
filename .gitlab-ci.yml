stages:
  - test
  - build
  - publish
  - deploy

variables:
  IMAGE_TAG: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"

test_job:
  stage: test
  image: node:22-alpine
  script:
    - npm ci
    - npm test

build_job:
  stage: build
  image: docker:cli
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  script:
    - docker info
    - docker build -t "$IMAGE_TAG" .
    - docker save "$IMAGE_TAG" -o image.tar
  artifacts:
    paths:
      - image.tar
    expire_in: 1 hour

publish_job:
  stage: publish
  image: docker:cli
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  needs:
    - job: build_job
      artifacts: true
  script:
    - docker load -i image.tar
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - docker push "$IMAGE_TAG"

deploy_job:
  stage: deploy
  image: alpine:3.22
  needs:
    - publish_job
  before_script:
    - apk add --no-cache openssh-client curl
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
    - chmod 600 ~/.ssh/deploy_key
    - ssh-keyscan -t ed25519 "$EC2_HOST" > ~/.ssh/known_hosts
    - ssh-keygen -lf ~/.ssh/known_hosts | awk '{print $2}' | grep -Fx "$EC2_HOST_KEY_FINGERPRINT"
  script:
    - |
      ssh -i ~/.ssh/deploy_key \
        -o IdentitiesOnly=yes \
        "$EC2_USER@$EC2_HOST" \
        "IMAGE_TAG='$IMAGE_TAG' CI_REGISTRY='$CI_REGISTRY' CI_REGISTRY_USER='$CI_REGISTRY_USER' CI_REGISTRY_PASSWORD='$CI_REGISTRY_PASSWORD' sh -s" <<'REMOTE'
      set -eu

      wait_for_http() {
        url="$1"
        attempt=1
        while [ "$attempt" -le 15 ]; do
          if curl -fsS --max-time 3 "$url" >/dev/null 2>&1; then
            echo "Healthy: $url"
            return 0
          fi
          echo "Waiting for app ($attempt/15)"
          attempt=$((attempt + 1))
          sleep 2
        done
        return 1
      }

      old_image=$(docker inspect node-todo-app --format '{{.Config.Image}}' 2>/dev/null || true)

      echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
      docker pull "$IMAGE_TAG"

      docker rm -f node-todo-candidate 2>/dev/null || true
      docker run -d --name node-todo-candidate \
        --user node \
        -p 127.0.0.1:8003:8000 "$IMAGE_TAG"

      if ! wait_for_http http://127.0.0.1:8003/todo; then
        docker logs node-todo-candidate || true
        docker rm -f node-todo-candidate || true
        echo "Candidate failed; production was not changed"
        exit 1
      fi

      if [ -z "$old_image" ]; then
        echo "No existing production image found; refusing to replace production"
        exit 1
      fi

      docker rm -f node-todo-app 2>/dev/null || true

      if docker run -d --name node-todo-app --restart unless-stopped \
        --user node \
        -p 127.0.0.1:8002:8000 "$IMAGE_TAG" &&
        wait_for_http http://127.0.0.1:8002/todo; then
        docker rm -f node-todo-candidate 2>/dev/null || true
        echo "Deployment successful"
        exit 0
      fi

      echo "Deployment failed; restoring previous image"
      docker rm -f node-todo-app 2>/dev/null || true

      if docker run -d --name node-todo-app --restart unless-stopped \
        --user node \
        -p 127.0.0.1:8002:8000 "$old_image" &&
        wait_for_http http://127.0.0.1:8002/todo; then
        docker rm -f node-todo-candidate 2>/dev/null || true
        echo "Rollback successful"
        exit 1
      fi

      echo "CRITICAL: rollback health check failed"
      docker rm -f node-todo-candidate 2>/dev/null || true
      exit 1
      REMOTE
